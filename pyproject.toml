[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-forecast-mlops"
version = "0.1.0"
description = "Production-oriented cryptocurrency forecasting and MLOps project"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pytest",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]